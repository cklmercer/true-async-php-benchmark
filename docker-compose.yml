name: benchmark

# k6 runs on this same network rather than against a published host port.
# On Docker Desktop the host port goes through the VM's NAT layer, which
# saturates well below what the server can serve — that would make this a
# benchmark of Docker's port forwarder.
#
# Nothing here is pinned to a CPU count or a machine. Every service sizes
# itself from whatever it is given; set WORKERS, WORKSPACES, VUS etc. per host.
#
# Deliberately no `cpus:` limits. Splitting the box statically between app, k6
# and Postgres was measured and it was worse across the board — 35k/28k against
# 44k/49k unbounded — because all three are bursty and a hard cap stops them
# borrowing from each other. The kernel scheduler sharing 14 cores beats any
# fixed split tried here.

services:
  app:
    build: .
    image: benchmark-app:local
    container_name: benchmark-app
    # The pool is opened in each worker's bootloader, so the database has to be
    # accepting connections before the server starts — otherwise every worker
    # fatals on connect and the server exits before it listens.
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      HTTP_PORT: "8080"
      # One listener, matched by TARGET_PORTS on the k6 service, because the
      # other two stacks have one and a benchmark should not give this one four.
      # The block exists for the generator rather than the server — a VU holds a
      # connection, so tens of thousands of them exhaust the client's ephemeral
      # port range long before the server minds. At the 1,000 VUs this test
      # runs it is worth 1.7%, inside run-to-run noise: 5,580 rps on four
      # listeners against 5,483 on one. Raise LISTEN_PORTS again before any run
      # that pushes VUs into the tens of thousands.
      HTTP_PORTS: "${LISTEN_PORTS:-1}"
      # One thread per core, the same as the third stack's ASYNC_THREADS, so
      # neither coroutine stack is given more of the machine than the other. It
      # was 6, which measured a shade better with k6 beside it (6 -> 51.5k/43.6k,
      # 10 -> 50.5k/42.8k) but is less than the machine has.
      #
      # Not comparable to the control's OCTANE_WORKERS, which has to be much
      # larger than the core count for a reason this stack does not share: see
      # the note there.
      WORKERS: "${WORKERS:-10}"
      JITTER_MIN_MS: "${JITTER_MIN_MS:-2}"
      JITTER_MAX_MS: "${JITTER_MAX_MS:-120}"
      PAGE_SIZE: "${PAGE_SIZE:-25}"
      # The statements one chat turn issues, and how wide each read is. Four
      # and two is six per request. Must match on every stack, or the three
      # numbers are not measuring the same work.
      READS_PER_REQUEST: "${READS_PER_REQUEST:-4}"
      WRITES_PER_REQUEST: "${WRITES_PER_REQUEST:-2}"
      MIN_PAGE_SIZE: "${MIN_PAGE_SIZE:-25}"
      MAX_PAGE_SIZE: "${MAX_PAGE_SIZE:-100}"
      # Milliseconds of simulated cost on each read. Two is roughly a read
      # against a database on another machine, which is what a deployment
      # normally has. READ_COST_MS=0 gives the warm index lookup on this same
      # machine instead, which is the least interesting case a real deployment
      # has and was the old default.
      READ_COST_MS: "${READ_COST_MS:-2}"
      APP_KEY: "benchmark-key-not-a-secret-value"

      # The tenancy boundary the chat log is keyed on. VUs are pinned to a
      # workspace, so this decides how wide the read load spreads over the
      # index. At the modelled ratio of 10-20 users per workspace, 8000 VUs
      # wants ~500.
      WORKSPACES: "${WORKSPACES:-512}"

      PG_DSN: "pgsql:host=postgres;port=5432;dbname=bench"
      PG_USER: "bench"
      PG_PASSWORD: "bench"
      # Per worker. Times WORKERS this is the backend count Postgres is asked
      # to hold, so it must stay under max_connections below.
      #
      # Sized so the pool is not what limits the stack. Six was measured
      # against a database that answered instantly, where a handle was held for
      # microseconds; with READ_COST_MS a read holds one for the whole of its
      # cost, and six became the ceiling. Swept at the 2ms default:
      # 6 -> 2,707, 12 -> 5,104, 24 -> 5,504, 48 -> 5,354 rps. It flattens at
      # 24, so that is the default and the runtime is what the number measures.
      PG_POOL: "${PG_POOL:-24}"
    ports:
      - "${APP_PORT:-8080}-8083:8080-8083"
    ulimits:
      # A socket per connection, and the ramp opens tens of thousands.
      nofile: { soft: 1048576, hard: 1048576 }
    sysctls:
      # setBacklog() is silently clamped to somaxconn; without this a ramp of
      # tens of thousands of connections is refused at the accept queue long
      # before the application is busy.
      net.core.somaxconn: "65535"
      net.ipv4.tcp_max_syn_backlog: "65535"

  # The control: stock Laravel on Octane/FrankenPHP, no TrueAsync anywhere.
  #
  # Started instead of `app`, never beside it — `make jitter STACK=laravel`
  # stops the other one first, because two servers sharing the box would be
  # measuring the scheduler.
  laravel:
    build: ./laravel
    image: benchmark-laravel:local
    container_name: benchmark-laravel
    profiles: [laravel]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      HTTP_PORT: "8080"
      # A worker is blocked for the whole of a request, including the jitter
      # sleep and every millisecond of READ_COST_MS, so this is not a core count
      # like the other stacks' thread counts — it is the concurrency ceiling of
      # the whole stack, and it has to exceed the core count by a lot before the
      # control is showing its own limit rather than this knob's.
      #
      # `auto` is not enough. It resolves to about twice the cores, which was
      # capping the control at less than half of what it can do once reads cost
      # anything. Swept at the 2ms default:
      # 10 -> 592, 20 -> 1,258, 40 -> 2,166, 80 -> 2,351, 160 -> 2,340 rps.
      # It flattens at 80, so that is the default. Eighty processes each holding
      # a booted Laravel is the price of the model, and it is the honest number
      # to compare against.
      OCTANE_WORKERS: "${OCTANE_WORKERS:-80}"
      # Octane recycles a worker every 500 requests by default, which at these
      # rates is a reboot several times a second.
      OCTANE_MAX_REQUESTS: "${OCTANE_MAX_REQUESTS:-10000000}"

      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:YmVuY2htYXJrLWtleS1ub3QtYS1zZWNyZXQtdmFsdWU="
      APP_URL: "http://laravel:8080"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      # The skeleton defaults to the database driver, which would put a query
      # on the jitter path — a test that is meant to have no database on it.
      #
      # `file`, not `cookie`. Laravel's cookie driver keeps the session id in
      # SESSION_COOKIE and the payload in a second cookie named after that id,
      # so a client has to carry both; the k6 scripts carry the session cookie
      # and XSRF-TOKEN, which is what a browser sends and what the other stack
      # needs. Under the cookie driver every request would arrive with no
      # payload, mint a new session, and 419 every write.
      SESSION_DRIVER: file
      SESSION_COOKIE: bench_session
      SESSION_LIFETIME: "120"
      # Same reasoning: the defaults are database-backed.
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: bench
      DB_USERNAME: bench
      DB_PASSWORD: bench

      JITTER_MIN_MS: "${JITTER_MIN_MS:-2}"
      JITTER_MAX_MS: "${JITTER_MAX_MS:-120}"
      PAGE_SIZE: "${PAGE_SIZE:-25}"
      # The statements one chat turn issues, and how wide each read is. Four
      # and two is six per request. Must match on every stack, or the three
      # numbers are not measuring the same work.
      READS_PER_REQUEST: "${READS_PER_REQUEST:-4}"
      WRITES_PER_REQUEST: "${WRITES_PER_REQUEST:-2}"
      MIN_PAGE_SIZE: "${MIN_PAGE_SIZE:-25}"
      MAX_PAGE_SIZE: "${MAX_PAGE_SIZE:-100}"
      # Milliseconds of simulated cost on each read. Two is roughly a read
      # against a database on another machine, which is what a deployment
      # normally has. READ_COST_MS=0 gives the warm index lookup on this same
      # machine instead, which is the least interesting case a real deployment
      # has and was the old default.
      READ_COST_MS: "${READ_COST_MS:-2}"
      WORKSPACES: "${WORKSPACES:-512}"
    ports:
      - "${LARAVEL_PORT:-8090}:8080"
    # The base image ships a healthcheck for its own default server, which this
    # one replaces; /up is the skeleton's health route.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20s
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    sysctls:
      net.core.somaxconn: "65535"
      net.ipv4.tcp_max_syn_backlog: "65535"

  # The third stack: the control's Laravel again, on the TrueAsync FrankenPHP
  # worker instead of Octane. Same skeleton, same routes, same controllers, same
  # middleware — the build copies them out of ./laravel — so what separates this
  # number from the control's is the server underneath and nothing else.
  #
  # It answers the question the control cannot: how much of the gap between the
  # two other stacks is coroutines, and how much is simply not being Laravel.
  #
  # Started instead of the others, never beside them.
  laravel-async:
    build:
      # The repository root, because the image copies ./laravel as well as this
      # stack's own files. Nothing is duplicated between the two.
      context: .
      dockerfile: laravel-async/Dockerfile
    image: benchmark-laravel-async:local
    container_name: benchmark-laravel-async
    profiles: [laravel-async]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # Worker threads, each running one booted application shared by every
      # coroutine on it. The analogue of the async stack's WORKERS, not of
      # Octane's OCTANE_WORKERS: a thread here is not blocked for the length of
      # a request, so this is a core count and not a concurrency ceiling.
      ASYNC_THREADS: "${ASYNC_THREADS:-10}"
      # Per thread, and the same number the async stack gets, so neither
      # coroutine stack is handed more of Postgres than the other. This stack
      # plateaus earlier than that one — 6 -> 2,019, 12 -> 2,199, 24 -> 2,190,
      # 48 -> 2,121 rps at the 2ms default — so 24 is past its knee and the
      # pool is not what limits it. It is also what makes the connection it
      # holds for a whole request cost nothing: see the note in the README.
      PG_POOL: "${PG_POOL:-24}"

      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:YmVuY2htYXJrLWtleS1ub3QtYS1zZWNyZXQtdmFsdWU="
      APP_URL: "http://laravel-async:8080"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      # Identical to the control's, and for the same reasons — see the notes on
      # the `laravel` service above.
      SESSION_DRIVER: file
      SESSION_COOKIE: bench_session
      SESSION_LIFETIME: "120"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: bench
      DB_USERNAME: bench
      DB_PASSWORD: bench

      JITTER_MIN_MS: "${JITTER_MIN_MS:-2}"
      JITTER_MAX_MS: "${JITTER_MAX_MS:-120}"
      PAGE_SIZE: "${PAGE_SIZE:-25}"
      # The statements one chat turn issues, and how wide each read is. Four
      # and two is six per request. Must match on every stack, or the three
      # numbers are not measuring the same work.
      READS_PER_REQUEST: "${READS_PER_REQUEST:-4}"
      WRITES_PER_REQUEST: "${WRITES_PER_REQUEST:-2}"
      MIN_PAGE_SIZE: "${MIN_PAGE_SIZE:-25}"
      MAX_PAGE_SIZE: "${MAX_PAGE_SIZE:-100}"
      # Milliseconds of simulated cost on each read. Two is roughly a read
      # against a database on another machine, which is what a deployment
      # normally has. READ_COST_MS=0 gives the warm index lookup on this same
      # machine instead, which is the least interesting case a real deployment
      # has and was the old default.
      READ_COST_MS: "${READ_COST_MS:-2}"
      WORKSPACES: "${WORKSPACES:-512}"
    ports:
      - "${LARAVEL_ASYNC_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20s
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    sysctls:
      net.core.somaxconn: "65535"
      net.ipv4.tcp_max_syn_backlog: "65535"

  postgres:
    image: postgres:17-alpine
    container_name: benchmark-postgres
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command:
      - postgres
      # WORKERS x PG_POOL backends, plus headroom for the seeder and psql.
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-500}"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      # Commits are acknowledged before the WAL fsync returns. Durable against
      # process death, not against sudden power loss — the tradeoff a write-heavy
      # deployment makes when it can afford to lose the last few milliseconds.
      - "-c"
      - "synchronous_commit=off"
      # Off: the WAL here is small rows at high rate, so compression spends CPU
      # per record to save bytes that were never the constraint.
      - "-c"
      - "wal_compression=off"
      - "-c"
      - "max_wal_size=8GB"
      # Every query here is an index range scan or a single-row insert, far
      # under the cost threshold JIT pays off at — so it only ever costs the
      # planner the check.
      - "-c"
      - "jit=off"
      # Nothing here reads pg_stat_statements and every statement pays for it.
      - "-c"
      - "track_activities=off"
      - "-c"
      - "track_counts=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "${PG_PORT:-5533}:5432"
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    shm_size: 1gb

  # One-shot: create and fill one log per workspace.
  seed:
    build: .
    image: benchmark-app:local
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      WORKSPACES: "${WORKSPACES:-512}"
      PG_DSN: "pgsql:host=postgres;port=5432;dbname=bench"
      PG_USER: "bench"
      PG_PASSWORD: "bench"
    command: php bin/seed ${ROWS_PER_WORKSPACE:-1000}

  # One-shot: `docker compose run --rm k6 run /scripts/<name>.js`
  k6:
    image: grafana/k6:latest
    profiles: [tools]
    depends_on:
      app: { condition: service_started }
    environment:
      TARGET: "http://app:8080"
      # Must match the app's HTTP_PORTS: with a block, VUs spread across
      # ephemeral port range stops being the ceiling. See benchmark/target.js.
      TARGET_PORTS: "${LISTEN_PORTS:-1}"
      # Must match the app's WORKSPACES: each VU is pinned to one workspace, so
      # this decides how many users share a database.
      WORKSPACES: "${WORKSPACES:-512}"
      K6_NO_USAGE_REPORT: "true"
    volumes:
      - ./benchmark:/scripts:ro
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    sysctls:
      # One connection per VU means VU count is bounded by the ephemeral source
      # port range, not by the server. The default 32768-60999 gives ~28k ports,
      # which is why runs died at ~29k VUs with "cannot assign requested
      # address" — a load generator limit that looks like a server failure.
      # This gives ~64.5k, and benchmark/target.js multiplies it by the listener count.
      net.ipv4.ip_local_port_range: "1024 65535"
      # Let sockets in TIME_WAIT be reused for new outbound connections, so
      # ports recycle instead of accumulating across a ramp.
      net.ipv4.tcp_tw_reuse: "1"
      net.ipv4.tcp_fin_timeout: "10"
